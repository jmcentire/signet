[package]
name = "signet-passkey-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Store-and-forward relay for Signet remote passkey approval. Carries sealed envelopes; cannot read them"

[[bin]]
name = "signet-passkey-relay"
path = "src/main.rs"

[dependencies]
signet-passkey = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
