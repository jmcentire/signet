[package]
name = "signet-passkey-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The computer side of Signet remote passkey approval: pairing, the relay client and the browser's native-messaging host"

[[bin]]
name = "signet-passkey"
path = "src/main.rs"

[dependencies]
signet-passkey = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
zeroize = { workspace = true }
url = "2.5.9"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
signet-passkey-relay = { workspace = true }
axum = { workspace = true }
tempfile = "3"
webauthn-rs = { version = "=0.5.5", default-features = false }
